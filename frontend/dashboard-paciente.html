<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - VitalSalud</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: { 50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)' },
                        secondary: 'var(--color-secondary)',
                    }
                }
            }
        }
    </script>
    <script src="./js/ui-utils.js"></script>
</head>

<body class="font-sans text-gray-800 bg-gray-50 flex h-screen selection:bg-primary-500 selection:text-white">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col h-full hidden md:flex shadow-sm">
        <div class="h-20 flex items-center px-6">
            <a href="./index.html" class="flex items-center gap-2">
                <div
                    class="w-8 h-8 bg-primary-500 text-white rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-primary-500/30">
                    V</div>
                <span class="font-heading font-bold text-xl tracking-tight text-secondary">Vital<span
                        class="text-primary-500">Salud</span></span>
            </a>
        </div>
        <nav class="flex-grow py-6 px-4 space-y-2">
            <a href="#"
                class="flex items-center gap-3 px-4 py-3 bg-primary-50 text-primary-600 rounded-xl font-medium transition-colors">
                <span>ðŸ </span> Dashboard
            </a>
            <a href="./agendar.html"
                class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-secondary rounded-xl transition-colors">
                <span>ðŸ“…</span> Agendar Cita
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()"
                class="w-full flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition-colors font-medium">
                <span>ðŸšª</span> Cerrar SesiÃ³n
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow overflow-y-auto p-6 md:p-10">
        <div class="max-w-4xl mx-auto">
            <header class="mb-10">
                <h1 id="welcome-msg" class="text-3xl font-heading font-bold text-secondary mb-2">Hola, ...</h1>
                <p class="text-gray-500">AquÃ­ puedes ver el historial de tus citas y programar nuevas consultas.</p>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div
                        class="w-12 h-12 bg-primary-50 text-primary-500 rounded-xl flex items-center justify-center text-xl">
                        ðŸ“…</div>
                    <div>
                        <p class="text-sm text-gray-400">Total Citas</p>
                        <p id="total-citas" class="text-2xl font-bold text-secondary">0</p>
                    </div>
                </div>
                <!-- Profile Summary -->
                <div
                    class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-center">
                    <p class="text-xs font-bold text-primary-500 uppercase tracking-widest mb-1">Mis Datos</p>
                    <div class="flex flex-wrap gap-x-6 gap-y-2">
                        <div>
                            <span class="text-xs text-gray-400">DNI:</span>
                            <span id="display-dni" class="text-sm font-semibold text-gray-700">-</span>
                        </div>
                        <div>
                            <span class="text-xs text-gray-400">TelÃ©fono:</span>
                            <span id="display-tel" class="text-sm font-semibold text-gray-700">-</span>
                        </div>
                        <div>
                            <span class="text-xs text-gray-400">Correo:</span>
                            <span id="display-correo" class="text-sm font-semibold text-gray-700">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <section>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-heading font-bold text-secondary">Mis Citas</h2>
                    <a href="./agendar.html"
                        class="text-primary-600 font-semibold hover:text-primary-700 text-sm flex items-center gap-1">+
                        Agendar nueva</a>
                </div>

                <div id="citas-paciente" class="space-y-4">
                    <!-- DinÃ¡mico -->
                    <div
                        class="text-center py-20 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200">
                        No tienes citas programadas actualmente.
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');

        if (!token || !userStr) {
            window.location.href = './login.html';
        }

        const user = JSON.parse(userStr);
        document.getElementById('welcome-msg').textContent = `Hola, ${user.correo.split('@')[0]}`;
        document.getElementById('display-correo').textContent = user.correo;

        async function loadDashboardData() {
            if (!user.id_paciente) return;

            const container = document.getElementById('citas-paciente');
            try {
                // 1. Cargar datos del paciente
                const resPac = await fetch(`/api/pacientes/${user.id_paciente}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const paciente = await resPac.json();
                if (resPac.ok) {
                    document.getElementById('welcome-msg').textContent = `Hola, ${paciente.nombres}`;
                    document.getElementById('display-dni').textContent = paciente.dni;
                    document.getElementById('display-tel').textContent = paciente.telefono;
                }

                // 2. Cargar citas
                const resCitas = await fetch(`/api/citas/paciente/${user.id_paciente}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const citas = await resCitas.json();

                document.getElementById('total-citas').textContent = citas.length;

                if (citas.length > 0) {
                    container.innerHTML = '';
                    citas.forEach(cita => {
                        const fecha = new Date(cita.fecha_cita).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                        const estado = cita.estado_cita || 'Pendiente';
                        let statusClass = 'bg-yellow-50 text-yellow-600 border-yellow-100';
                        if (estado === 'Atendido') statusClass = 'bg-green-50 text-green-600 border-green-100';
                        if (estado === 'No AsistiÃ³') statusClass = 'bg-red-50 text-red-600 border-red-100';

                        container.innerHTML += `
                                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <div class="flex items-center gap-4">
                                                <div class="w-14 h-14 bg-gray-50 rounded-xl flex flex-col items-center justify-center text-secondary border border-gray-100">
                                                    <span class="text-[10px] uppercase font-bold text-gray-400">${new Date(cita.fecha_cita).toLocaleString('es-ES', { month: 'short' })}</span>
                                                    <span class="text-xl font-bold">${new Date(cita.fecha_cita).getDate()}</span>
                                                </div>
                                                <div>
                                                    <h3 class="font-bold text-secondary">Dr. ${cita.medico_nombres} ${cita.medico_apellidos}</h3>
                                                    <p class="text-sm text-primary-600 font-medium">${cita.especialidad}</p>
                                                    <p class="text-xs text-gray-400 mt-1">Hora: ${cita.hora_cita.substring(0, 5)}</p>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-3 w-full md:w-auto">
                                                <span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}">${estado}</span>
                                            </div>
                                        </div>
                                    `;
                    });
                }
            } catch (error) {
                console.error(error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = './login.html';
        }

        document.addEventListener('DOMContentLoaded', loadDashboardData);
    </script>
</body>

</html>
