<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - VitalSalud</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] },
                    colors: {
                        primary: { 50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)', 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)', 700: 'var(--color-primary-700)' },
                        secondary: 'var(--color-secondary)',
                    }
                }
            }
        }
    </script>
    <script src="./js/ui-utils.js"></script>
</head>
<body class="font-sans text-gray-800 bg-gray-50 h-screen flex flex-col selection:bg-primary-500 selection:text-white">

    <nav class="w-full z-50 glass shadow-sm py-4 fixed top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-center">
            <a href="./index.html" class="flex items-center gap-2 cursor-pointer">
                <div class="w-10 h-10 bg-primary-500 text-white rounded-xl flex items-center justify-center font-bold text-2xl shadow-lg shadow-primary-500/30">V</div>
                <span class="font-heading font-bold text-2xl tracking-tight text-secondary">Vital<span class="text-primary-500">Salud</span></span>
            </a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center pt-20 px-4">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
            <h2 class="text-3xl font-heading font-bold text-secondary text-center mb-2">Iniciar Sesión</h2>
            <p class="text-gray-500 text-center mb-8 text-sm">Bienvenido de nuevo a tu portal de salud</p>



            <!-- Role Selector -->
            <div class="flex p-1 bg-gray-100 rounded-2xl mb-8">
                <button type="button" onclick="setRole('paciente', this)" class="role-btn flex-1 py-2 text-sm font-bold rounded-xl transition-all bg-white text-primary-600 shadow-sm">Paciente</button>
                <button type="button" onclick="setRole('recepcionista', this)" class="role-btn flex-1 py-2 text-sm font-bold rounded-xl transition-all text-gray-500 hover:text-gray-700">Recepción</button>
                <button type="button" onclick="setRole('administrador', this)" class="role-btn flex-1 py-2 text-sm font-bold rounded-xl transition-all text-gray-500 hover:text-gray-700">Admin</button>
            </div>

            <form id="login-form" class="space-y-6">
                <input type="hidden" id="selected-role" value="paciente">
                <div>
                    <label for="correo" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all" placeholder="tucorreo@ejemplo.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full bg-primary-500 hover:bg-primary-600 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-primary-500/30 transform hover:-translate-y-0.5">
                    Entrar
                </button>
            </form>

            <p class="text-center mt-8 text-sm text-gray-500">
                ¿No tienes una cuenta? <a href="./registro-cuenta.html" class="text-primary-600 font-semibold hover:text-primary-700">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        function setRole(role, btn) {
            document.getElementById('selected-role').value = role;
            document.querySelectorAll('.role-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-primary-600', 'shadow-sm');
                b.classList.add('text-gray-500', 'hover:text-gray-700');
            });
            btn.classList.remove('text-gray-500', 'hover:text-gray-700');
            btn.classList.add('bg-white', 'text-primary-600', 'shadow-sm');
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const selectedRole = document.getElementById('selected-role').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    UI.showToast(data.error || 'Credenciales inválidas', 'error');
                } else {
                    if (data.user.rol !== selectedRole) {
                        UI.showToast(`Esta cuenta no tiene permisos de ${selectedRole}.`, 'error');
                        return;
                    }

                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    if (data.user.rol === 'administrador') {
                        window.location.href = './admin-dashboard.html';
                    } else if (data.user.rol === 'recepcionista') {
                        window.location.href = './recepcionista.html';
                    } else if (data.user.rol === 'paciente') {
                        if (!data.user.id_paciente) {
                            window.location.href = './completar-perfil.html';
                        } else {
                            window.location.href = './dashboard-paciente.html';
                        }
                    } else {
                        window.location.href = './index.html';
                    }
                }
            } catch (error) {
                UI.showToast('Error de conexión con el servidor.', 'error');
            }
        });
    </script>
</body>
</html>
